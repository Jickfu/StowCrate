name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_NOLOGO: true

jobs:
  build-and-test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
          - os: ubuntu-latest
            rid: linux-x64
          - os: macos-latest
            rid: osx-x64

    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 安装 .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.4xx

      - name: 还原依赖
        run: dotnet restore StowCrate.slnx

      - name: 构建
        run: dotnet build StowCrate.slnx --configuration Release --no-restore

      - name: 获取并校验固定版本 7-Zip
        shell: pwsh
        run: ./eng/Acquire-Bundled7Zip.ps1 -RuntimeIdentifier '${{ matrix.rid }}'

      - name: 获取 macOS universal 7-Zip 的另一 RID placement
        if: matrix.os == 'macos-latest'
        shell: pwsh
        run: ./eng/Acquire-Bundled7Zip.ps1 -RuntimeIdentifier 'osx-arm64'

      - name: 测试
        run: dotnet test StowCrate.slnx --configuration Release --no-build
        env:
          STOWCRATE_7ZIP_ROOT: ${{ github.workspace }}/artifacts/bundled/7zip
